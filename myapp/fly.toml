# fly.toml app configuration file generated for test-app-siid on 2026-11-01T17:40:42+09:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'test-app-siid'
primary_region = 'sin'
console_command = 'php /var/www/html/artisan tinker'

[build]
  [build.args]
    NODE_VERSION = '22'
    PHP_VERSION = '8.4'

[env]
  APP_ENV = 'production'
  LOG_CHANNEL = 'stderr'
  LOG_LEVEL = 'info'
  LOG_STDERR_FORMATTER = 'Monolog\Formatter\JsonFormatter'
  SESSION_DRIVER = 'cookie'
  SESSION_SECURE_COOKIE = 'true'
  APP_URL = 'https://test-app-siid.fly.dev'
  R2_BUCKET = 'siid-test'
  R2_ENDPOINT = 'https://b7686a908b5294babdadb531170219ce.r2.cloudflarestorage.com'
  R2_URL = 'https://pub-a4375ca53a72452ca872f132d2001209.r2.dev'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024

[deploy]
  release_command = 'php /var/www/html/artisan migrate --force'